workflows:
  unity-ios-workflow:
    name: Unity iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - unity_credentials
      vars:
        UNITY_BIN: /Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity
    scripts:
      - name: Activate Unity License
        script: |
          $UNITY_BIN -batchmode -quit -logFile -serial $UNITY_SERIAL -username $UNITY_USERNAME -password $UNITY_PASSWORD
      - name: Build iOS Xcode Project
        script: |
          $UNITY_BIN -batchmode -quit -projectPath . -executeMethod UnityEditor.BuildPlayer -buildTarget iOS -customBuildPath ./build/ios
    artifacts:
      - build/ios/**